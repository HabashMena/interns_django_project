<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update User Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3a0ca3;
            --accent: #4cc9f0;
            --light: #f8f9fa;
            --dark: #212529;
            --gray: #6c757d;
            --success: #4bb543;
            --error: #e63946;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }
        
        .update-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
            transform: translateY(0);
            transition: all 0.3s ease;
        }
        
        .update-container:hover {
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            transform: translateY(-5px);
        }
        
        .form-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 1.5rem;
            text-align: center;
        }
        
        .form-header h2 {
            font-weight: 600;
            font-size: 1.5rem;
        }
        
        .form-body {
            padding: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--dark);
            font-weight: 500;
            font-size: 0.95rem;
        }
        
        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background-color: #f9f9f9;
        }
        
        .form-control:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
            background-color: white;
        }
        
        .form-control::placeholder {
            color: #aaa;
            font-weight: 300;
        }
        
        .form-text {
            display: block;
            margin-top: 0.25rem;
            color: var(--gray);
            font-size: 0.8rem;
            font-style: italic;
        }
        
        .btn-update {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0.5rem;
        }
        
        .btn-update:hover {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            transform: translateY(-2px);
        }
        
        .btn-update:active {
            transform: translateY(0);
        }
        
        .back-link {
            display: inline-block;
            margin-top: 1rem;
            color: var(--gray);
            text-decoration: none;
            transition: color 0.3s ease;
            text-align: center;
            width: 100%;
        }
        
        .back-link:hover {
            color: var(--primary);
        }
        
        /* Remove number input arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0; 
        }
        
        /* Error message styling */
        .error-message {
            color: var(--error);
            font-size: 0.85rem;
            margin-top: 0.25rem;
            display: none;
        }
        
        /* Responsive adjustments */
        @media (max-width: 576px) {
            body {
                padding: 1rem;
            }
            
            .form-body {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="update-container">
        <div class="form-header">
            <h2>Update User Profile</h2>
        </div>
        
        <div class="form-body">
            <form method="POST" autocomplete="off">
                {% csrf_token %}
                
                <!-- Full Name Field -->
                <div class="form-group">
                    <label for="FullName">Full Name</label>
                    <input 
                        type="text" 
                        id="FullName" 
                        name="FullName" 
                        value="{{ user.FullName }}" 
                        placeholder="Enter full name"
                        class="form-control"
                        required
                    >
                </div>
                
                <!-- Age Field -->
                <div class="form-group">
                    <label for="Age">Age</label>
                    <input 
                        type="number" 
                        id="Age" 
                        name="Age" 
                        value="{{ user.Age }}" 
                        placeholder="Enter age"
                        class="form-control"
                        min="1"
                        max="120"
                        required
                    >
                </div>
                <button type="submit" class="btn-update">Update Profile</button>
                <a href="{% url 'get' %}" class="back-link">← Back to Users List</a>
            </form>
        </div>
    </div>
</body>
</html>
