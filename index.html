<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tic Tac Toe by Aya</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2 style="text-align:center;">Tic Tac Toe by Aya</h2>
  <h3 style="text-align:center;">Player 1 = X     |     Player 2 = O</h3>

  <table>
    <tr>
      <td onclick="move(0)"></td>
      <td onclick="move(1)"></td>
      <td onclick="move(2)"></td>
    </tr>
    <tr>
      <td onclick="move(3)"></td>
      <td onclick="move(4)"></td>
      <td onclick="move(5)"></td>
    </tr>
    <tr>
      <td onclick="move(6)"></td>
      <td onclick="move(7)"></td>
      <td onclick="move(8)"></td>
    </tr>
  </table>

  <h3 id="message" style="text-align:center;"></h3>
  <script src="script.js"></script>
</body>
</html>
