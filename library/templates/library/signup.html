<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(120deg, #FFB6C1, #FF91A4); /* Light pink gradient background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            background-color: white;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            width: 350px;
        }

        .form-container h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
            font-size: 24px;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            color: #FF6F91;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="text"] {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #FF91A4;
            border-radius: 6px;
            font-size: 14px;
            color: #FF6F91;
        }

        button {
            padding: 10px;
            background-color: #FF91A4;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #FF6F91;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Add Book ({{ view_type }})</h2>
        <form method="POST">
            {% csrf_token %}
            <label for="title">Title</label>
            <input type="text" id="title" name="title" placeholder="Book title" required>

            <label for="author">Author</label>
            <input type="text" id="author" name="author" placeholder="Author name" required>

            <button type="submit">Add Book</button>
        </form>
    </div>
</body>
</html>
