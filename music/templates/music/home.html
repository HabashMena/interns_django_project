<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instrument Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            padding-top: 40px;
        }
        .container {
            max-width: 600px;
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        .view-type {
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="mb-4 text-center">🎵 Instrument Manager</h2>
    <p class="text-center view-type">Current View: <strong>{{ view_type }}</strong></p>

    <form method="post" class="mb-4">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Add Instrument</button>
        </div>
    </form>

    <hr>

    <h4 class="mb-3">🎼 Instruments List</h4>
    {% if instruments %}
        <ul class="list-group">
            {% for instrument in instruments %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span>{{ instrument.name }}</span>
                    <span class="badge bg-secondary">{{ instrument.type }}</span>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p class="text-muted">No instruments added yet.</p>
    {% endif %}
</div>

</body>
</html>
